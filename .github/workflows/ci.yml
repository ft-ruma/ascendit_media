name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Builds on the seed content (no DATABASE_URI) so CI never needs a database.
      - run: pnpm build
      - name: First-load JS budget (200 KB per public route)
        run: pnpm size
      - run: pnpm exec playwright install --with-deps chromium
      - name: End to end + axe (desktop and phone)
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: test-results }
      - name: Lighthouse CI (Moto G Power, slow 4G)
        run: |
          (pnpm start -p 3100 &) && npx wait-on http://localhost:3100
          npx @lhci/cli@0.14.x autorun
